
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy type checking
        entry: mypy ai_chat.py
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: pytest -q tests
        language: system
        pass_filenames: false

      - id: vulture
        name: vulture dead code check
        entry: vulture ai_chat.py
        language: system
        pass_filenames: false

      - id: bandit
        name: bandit security scan
        entry: bandit -q -r ai_chat.py tests -s B101,B110
        language: system
        pass_filenames: false
